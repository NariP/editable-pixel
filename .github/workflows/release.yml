name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Ordering matters twice over:
      #  1. Corepack runs before actions/setup-node because `cache: pnpm` locates
      #     the store by running `pnpm store path`, so pnpm must be on PATH first.
      #  2. `enable pnpm` is scoped deliberately. Bare `corepack enable` also
      #     shims npm, and that shim refuses to run in a repository whose
      #     `packageManager` field says pnpm — which would break the
      #     `npm install --global` inside install.sh that test:distribution runs.
      # The pnpm version itself comes from `packageManager`, keeping package.json
      # the single source.
      #
      # This ordering requires actions/setup-node v7 or newer on Windows.
      # Corepack writes its shims next to the *current* node, so under v4 they
      # landed in the runner's preinstalled Node dir; setup-node then only
      # prepended the toolcache to PATH, and the Windows `.cmd` shim — which is
      # early-bound to the node.exe beside it, unlike a Linux `#!/usr/bin/env
      # node` shim — kept invoking the old runtime. See actions/setup-node#531.
      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check tag and package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./packages/pixel-cli/package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm test:distribution
      - run: pnpm test:source-install
      - name: Build release assets
        run: |
          mkdir release-artifacts
          pnpm --filter editable-pixel pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "release-artifacts/editable-pixel-skill-${TAG_VERSION}.tar.gz" -C skills editable-pixel
          cd release-artifacts
          shasum -a 256 editable-pixel-*.tgz editable-pixel-skill-*.tar.gz > SHA256SUMS
      - name: Publish npm package
        run: npm publish "./release-artifacts/editable-pixel-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --title "Editable Pixel ${TAG_VERSION}" \
            --generate-notes \
            --notes "Compatibility: Pixel Document v1. Includes CLI, local web editor, MCP executable, and agent skill archive. Verify downloaded assets with SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
