name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WORKAROUND: https://github.com/actions/setup-node/issues/531
      #
      # setup-node runs twice on purpose, mirroring ci.yml so the two setups
      # cannot drift. Corepack writes its shims next to the *currently active*
      # node (`dirname(process.execPath)`), and on Windows the generated
      # `pnpm.cmd` is early-bound to the `node.exe` in its own directory, so a
      # Corepack-before-setup-node order pins the build to the runner's
      # preinstalled Node instead of `.nvmrc`. This job only runs on ubuntu,
      # where shims late-bind through `#!/usr/bin/env node` — the split is kept
      # anyway so release and CI exercise an identical toolchain setup.
      #
      # Order: (1) install Node from .nvmrc with no cache input, so nothing needs
      # pnpm yet; (2) enable Corepack, binding the shims to that Node; (3) run
      # setup-node again for `cache: pnpm`, which can now resolve the store.
      #
      # `enable pnpm` stays scoped. Bare `corepack enable` also shims npm, and
      # that shim refuses to run in a repository whose `packageManager` says
      # pnpm — breaking the `npm install --global` inside install.sh that
      # test:distribution runs. The pnpm version itself comes from
      # `packageManager`, keeping package.json the single source.
      #
      # `registry-url` belongs on the *second* call: it writes the .npmrc that
      # `npm publish` authenticates with, so it must be the setup that runs last.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
          node --version
          pnpm --version
      - name: Restore pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check tag and package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./packages/pixel-cli/package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm test:distribution
      - run: pnpm test:source-install
      - name: Build release assets
        run: |
          mkdir release-artifacts
          pnpm --filter editable-pixel pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "release-artifacts/editable-pixel-skill-${TAG_VERSION}.tar.gz" -C skills editable-pixel
          cd release-artifacts
          shasum -a 256 editable-pixel-*.tgz editable-pixel-skill-*.tar.gz > SHA256SUMS
      - name: Publish npm package
        run: npm publish "./release-artifacts/editable-pixel-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --title "Editable Pixel ${TAG_VERSION}" \
            --generate-notes \
            --notes "Compatibility: Pixel Document v1. Includes CLI, local web editor, MCP executable, and agent skill archive. Verify downloaded assets with SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
