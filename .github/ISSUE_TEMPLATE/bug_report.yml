name: Bug report
description: Report a reproducible problem in conversion, editing, sessions, CLI, MCP, or export.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include session tokens, one-time URLs, private images, or security vulnerabilities. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Editable Pixel version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Converter
        - Web editor
        - Local session server
        - CLI
        - MCP or agent integration
        - Renderer or export
        - Pixel Document
        - Packaging
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Include commands and a minimal sanitized fixture when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 20.19, Codex or Claude version
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, launch URLs, personal paths, and private image data.
          required: true
        - label: This is not a security vulnerability.
          required: true
